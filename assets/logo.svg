<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="offbooklabs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="disc" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#1c1c1e"/><stop offset="1" stop-color="#0d0d0e"/>
    </radialGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4E7EE"/><stop offset="1" stop-color="#8E9198"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F4F8"/><stop offset=".5" stop-color="#9A9DA4"/><stop offset="1" stop-color="#D9DCE2"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="32" cy="32" r="16"/></clipPath>
