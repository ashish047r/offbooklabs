  <circle cx="32" cy="32" r="31" fill="url(#disc)"/>
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="#fff" stroke-opacity=".06"/>
  <g clip-path="url(#lens)">
    <rect x="14" y="14" width="36" height="36" fill="#141415"/>
    <polygon points="14,14 39,14 25,50 14,50" fill="url(#light)"/>
  </g>
  <circle cx="32" cy="32" r="16.5" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
